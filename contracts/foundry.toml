[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "prague"          # Monad supports Pectra (EIP-7702); avoid newer opcodes
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./deployments" }]
gas_limit = "18446744073709551615"  # tests only: the lifecycle meta-test runs 60 full circles in one test

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 256
depth = 96

# Monad: `network = "monad"` per docs.monad.xyz/guides/deploy-smart-contract/foundry.
# Kept in the rpc profiles below so local tests run on the default EVM.
[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_mainnet = "https://rpc.monad.xyz"

[lint]
lint_on_build = false

[fmt]
line_length = 110
