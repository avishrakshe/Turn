# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: turn-indexer
description: Turn — onchain savings circles on Monad. Circles, rounds, live auctions, payments, defaults, auto-pay sessions, cross-circle credit, corridor and network stats.
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: CircleFactory
    abi_file_path: ./abis/CircleFactory.json
    events:
      - event: CircleCreated
  - name: Circle
    # Registered dynamically from CircleFactory.CircleCreated
    abi_file_path: ./abis/Circle.json
    events:
      - event: Joined
      - event: Left
      - event: CircleStarted
      - event: RoundOpened
      - event: ContributionPaid
      - event: ContributionFailed
      - event: BidPlaced
      - event: AuctionClosed
      - event: PayoutMade
      - event: CreditAccrued
      - event: CollateralPosted
      - event: CollateralReleased
      - event: DepositRebated
      - event: DefaultMarked
      - event: MemberEjected
      - event: RepaymentOwed
      - event: RepaymentPaid
      - event: RoundCancelled
      - event: ReserveChanged
      - event: CircleCompleted
      - event: Claimed
      - event: MemberProfileSet
  - name: CreditRegistry
    abi_file_path: ./abis/CreditRegistry.json
    events:
      - event: RecordUpdated
  - name: AUSD
    # The settlement token (Agora AUSD). Only transfers that touch a Turn member are stored (handlers/AUSD.ts).
    abi_file_path: ./abis/AUSD.json
    events:
      - event: Transfer
  - name: TurnAccount
    # EIP-7702 accounts: events are emitted *at the member's own address*. Registered when they join a circle.
    abi_file_path: ./abis/TurnAccount.json
    events:
      - event: PullGranted
      - event: PullRevoked
      - event: Pulled
chains:
  - id: 10143 # Monad testnet — addresses from contracts/deployments/10143.json (env vars override for redeploys)
    start_block: ${ENVIO_START_BLOCK:-70170111}
    contracts:
      - name: CircleFactory
        address: "${ENVIO_FACTORY_ADDRESS:-0xCC90d683Aa8945dd7DD8C0be117e4b2592ECc2E0}"
      - name: CreditRegistry
        address: "${ENVIO_REGISTRY_ADDRESS:-0x9824f180Af7D8c03de3c366F688eEA2d6193aDB7}"
      - name: AUSD
        # Agora's official testnet AUSD (docs.agora.finance/developer/contract-deployments)
        address: "${ENVIO_TOKEN_ADDRESS:-0xa9012a055bd4e0eDfF8Ce09f960291C09D5322dC}"
      - name: Circle
      - name: TurnAccount
